############################
#### Libraries Version ####
##########################
ffmpeg_version=9.0.2-1.5.14
xz_version=1.12
waterconfig_version=1.0.0.1
waterconfig_range=[1.0.0.0,1.0.1)
junit_version=6.0.2
# THE PENTESTING CORPUS DRIVES DECODERS UP TO ImageReader.MAX_DECODED_BYTES (512 MiB), SO THE TEST
# JVM NEEDS HEADROOM ABOVE THAT OR A BOMB EXHAUSTS THE JVM BEFORE THE BUDGET CAN REJECT IT
test_max_heap=2g
test_max_direct_memory=1g
# LWJGL THREAD STACK (KiB) FOR THE GPU TESTS: new VkInstance LISTS EVERY DRIVER EXTENSION ON IT, PAST THE 64 KiB DEFAULT
test_lwjgl_stack=1024
require_natives=false
log4j_version=2.26.1
gson_version=2.10
lwjgl_version=3.3.6
joml_version=1.10.8
javafx_version=21
# STANDALONE LAUNCHER CLASSIFIERS; bootstrap.properties PINS THE SHA-256 OF EVERY DOWNLOADABLE JAR
lwjgl_platforms=windows,windows-arm64,linux,linux-arm64,macos,macos-arm64
