github=SrRapero720/watermedia
modrinthid=G922NeHS
curseforgeid=869524

############################
#### Loader ranges ########
##########################
# MINIMUM VERSION OF EVERY SUPPORTED LINE IN ASCENDING ORDER; gradle/common.gradle ADDS THE CEILINGS
# PUBLISHED MINECRAFT VERSIONS, EACH ONE AN EXACT MATCH
minecraftversions=1.18.2,1.19.2,1.20.1,1.21.1,1.21.11,26.1.2,26.2
# CLOSES AT THE NEXT MAJOR, WHICH ALSO RANGES THE FORGE FML LOADER: 40.3.10 BECOMES [40.3.10,41)
forgeversions=40.3.10,43.5.0,47.4.2,52.1.1,61.0.5,64,65
# CLOSES BEFORE THE NEXT MINECRAFT LINE, EVERY COMPONENT BUT THE BUILD: 21.1.0 BECOMES [21.1.0,21.2)
neoversions=21.1.0,21.11.0,26.1.2.0,26.2.0.0
neofmlversions=4,10,11
fabricversions=0.14
# PUBLISHED JAVA VERSIONS; ONE RANGE SPANS FROM THE OLDEST UP TO THE NEXT MAJOR OF THE NEWEST
javaversions=17,21,25
# CLOSES AT THE NEXT MINOR; A RELEASE MATCHES EXACTLY BECAUSE ITS X.Y.Z.W BETAS SORT ABOVE IT
binariesversions=3.0.0

