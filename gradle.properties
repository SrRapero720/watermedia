#########################
#### Gradle runtime ####
########################
org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+UnlockExperimentalVMOptions -Dfile.encoding=UTF-8 -Dsun.rmi.dgc.server.gcInterval=2147483646 -XX:G1NewSizePercent=20 -XX:G1ReservePercent=20 -XX:MaxGCPauseMillis=50 -XX:G1HeapRegionSize=32M
org.gradle.daemon=true
org.gradle.caching=false
org.gradle.parallel=true
systemProp.file.encoding=UTF-8
# USE COMPILED DEPENDENCIES FOR IDEA TYPE RESOLUTION; ATTACHED KOTLIN SOURCES LOSE THE SCRIPT CLASSPATH.
systemProp.idea.gradle.download.sources.force=false

#############################
#### Project properties ####
###########################
id=watermedia
libname=WaterMedia
group=org.watermedia
version=3.0.0
versiontype=RELEASE
mainclass=org.watermedia.bootstrap.AppBootstrap
