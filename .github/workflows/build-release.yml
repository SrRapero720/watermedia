name: Build for Release

# A TAG BUILDS ONCE, PUBLISHES THE GITHUB RELEASE, THEN EACH STORE UPLOADS THOSE FILES AND SYNCS ITS DESCRIPTION WITH
# README.md, SO A STORE THAT FAILS NEVER HOLDS THE OTHER BACK. RUN BY HAND, IT ONLY SYNCS THE DESCRIPTIONS
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      store:
        description: Store whose description takes the README of the selected branch or tag
        type: choice
        options: [all, curseforge, modrinth]
        default: all

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    env:
      ALSOFT_DRIVERS: 'null'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      # A TAG PUSHED WITHOUT ITS BUMP WOULD PUBLISH THE PREVIOUS VERSION AGAIN
      - name: Check the tag is the version
        shell: pwsh
        run: |
          $version = ((Get-Content gradle.properties | Select-String '^version=').Line -split '=', 2)[1]
          if ($version -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME is not the version $version" }

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Install Linux media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxcb1 libxcb-shm0 libudev1 libasound2 libva2 libva-drm2 libdrm2

      - name: Build and test
        run: gradle build --warning-mode fail

      - name: Keep the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: libs
          path: build/libs
          if-no-files-found: error
          compression-level: 0

  # THE PUBLISH JOBS TAKE THE BUILT JARS, SO -x KEEPS GRADLE FROM PACKAGING THEM AGAIN
  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Take the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: libs
          path: build/libs
          digest-mismatch: error

      - name: Publish the GitHub release
        run: gradle publishGithub -x jar -x sourcesJar --warning-mode fail
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  curseforge:
    needs: release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Take the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: libs
          path: build/libs
          digest-mismatch: error

      - name: Upload to CurseForge
        run: gradle publishCurseforge -x jar -x sourcesJar --warning-mode fail
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

  modrinth:
    needs: release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Take the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: libs
          path: build/libs
          digest-mismatch: error

      - name: Upload to Modrinth
        run: gradle publishModrinth -x jar -x sourcesJar --warning-mode fail
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

  # A TAG SYNCS AFTER ITS OWN STORE'S UPLOAD; A MANUAL RUN SKIPS THE UPLOADS AND SYNCS THE STORES IT NAMES
  curseforge-description:
    needs: curseforge
    if: ${{ !cancelled() && (needs.curseforge.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.store != 'modrinth')) }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Sync the CurseForge description
        run: gradle syncCurseforgeDescription --warning-mode fail
        env:
          CURSEFORGE_SESSION: ${{ secrets.CURSEFORGE_SESSION }}
          CURSEFORGE_AUTHORS_USER: ${{ secrets.CURSEFORGE_AUTHORS_USER }}

  modrinth-description:
    needs: modrinth
    if: ${{ !cancelled() && (needs.modrinth.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.store != 'curseforge')) }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Sync the Modrinth description
        run: gradle syncModrinthDescription --warning-mode fail
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
